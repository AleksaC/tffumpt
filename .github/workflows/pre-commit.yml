name: pre-commit

on:
  push: &triggers
    branches:
      - main
  pull_request: *triggers

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: pre-commit/action@v3.0.1
        env:
          SKIP: golangci-lint-config-verify,golangci-lint-full
